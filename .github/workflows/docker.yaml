name: docker

# Plan Phase 10's release image build: multi-arch, with provenance and an SBOM,
# gated by a Trivy scan, publishing immutable digests. Not triggered by a `v*`
# tag push directly: release-please creates the tag with the built-in
# GITHUB_TOKEN, and events raised by that token start no workflows, so
# `release.yaml` calls this file instead (see docs/hosting.md, "Releases").
# `containers.yaml` still builds/smokes/pushes the `main` and `sha-` images.
#
#   build (server, client)  push only `sha-<short>`, scan that exact digest
#   promote                 once BOTH scans pass, add vX.Y.Z and X.Y to those digests
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3"
        type: string
        required: true
    outputs:
      server_digest:
        description: "sha256 digest of the published server image index"
        value: ${{ jobs.promote.outputs.server_digest }}
      client_digest:
        description: "sha256 digest of the published client image index"
        value: ${{ jobs.promote.outputs.client_digest }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3 (refused if that tag already points at a different image)"
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [server, client]
    steps:
      - name: Validate tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z (got '$TAG')"; exit 1 ;;
          esac
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute names
        id: names
        run: |
          version="${TAG#v}"
          {
            echo "image=${REGISTRY}/${OWNER}/castle-clash-${APP}"
            echo "version=${version}"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          APP: ${{ matrix.app }}
      # Only the `sha-` tag is published here. The release tags (vX.Y.Z, X.Y)
      # are added by `promote`, after every scan has passed, so a vulnerable
      # image never carries a tag anything deploys from.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:sha-${{ steps.names.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            SERVER_VERSION=${{ steps.names.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      # Scans the exact pushed digest (linux/amd64 — Trivy resolves the runner's
      # platform), failing the job on any CRITICAL finding that has a fix.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Record digest
        run: echo "$DIGEST" > "${APP}.txt"
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.app }}
          path: ${{ matrix.app }}.txt
          retention-days: 1

  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      server_digest: ${{ steps.promote.outputs.server }}
      client_digest: ${{ steps.promote.outputs.client }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A matrix job's outputs collide (last writer wins), which is why the
      # digests travel as artifacts; they are read here from the builds
      # themselves, never re-resolved from a movable tag.
      - id: promote
        run: |
          version="${TAG#v}"
          minor="${version%.*}"
          for app in server client; do
            image="${REGISTRY}/${OWNER}/castle-clash-${app}"
            digest="$(cat "digests/${app}.txt")"
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "::error::no valid digest for ${app} (got '${digest}')"; exit 1 ;;
            esac
            # Release tags are immutable: re-running for a tag that already
            # points at a different image would silently move a shipped release.
            existing="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
              echo "::error::${image}:${TAG} already points at ${existing}, refusing to move it to ${digest}"
              exit 1
            fi
            docker buildx imagetools create --tag "${image}:${TAG}" --tag "${image}:${minor}" "${image}@${digest}"
            echo "${app}=${digest}" >> "$GITHUB_OUTPUT"
            echo "- ${app}: \`${digest}\` tagged \`${TAG}\`, \`${minor}\`" >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          TAG: ${{ inputs.tag }}
