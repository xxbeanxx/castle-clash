name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly balance-report run (plan Phase 7's CI/CD integration step) —
    # a separate trigger so it never runs on every PR/push, only once a day
    # plus on-demand via workflow_dispatch below.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # @castle-clash/shared's tests run once, below, with coverage — excluded
      # here so its suite doesn't run twice in the same job.
      - run: pnpm turbo run test --filter='!@castle-clash/shared'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          # A property test's failing input is reproducible by re-running
          # locally with the same FC_SEED (fast-check prints the seed it
          # used on any failure) — tying it to the run id means a CI failure
          # is always reproducible without guessing which seed ran.
          FC_SEED: ${{ github.run_id }}
      - run: pnpm --filter @castle-clash/shared run test:coverage
        env:
          FC_SEED: ${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-coverage
          path: packages/shared/coverage/

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm --filter @castle-clash/client exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @castle-clash/client exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @castle-clash/client exec playwright install-deps chromium
      - run: pnpm --filter @castle-clash/client run test:browser

  # Plan Phase 7's CI/CD integration step — nightly (or on-demand via
  # workflow_dispatch), never on a PR/push: it tracks power-up/weapon win-rate
  # trends for tuning, nothing blocks on it.
  balance-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @castle-clash/shared run sim:balance
        env:
          SIM_BALANCE_MATCHES: 5000
      - uses: actions/upload-artifact@v7
        with:
          name: balance-report
          path: packages/shared/balance-report/
