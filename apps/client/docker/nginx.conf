server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
