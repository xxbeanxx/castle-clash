name: Deploy Environment - Migrate, Deploy & Smoke Test (reusable)

# One environment's rollout, called by deploy.yaml for `staging` and then
# `production`. The GitHub environment named by `environment` supplies that
# environment's secrets/variables and (for production) the required-reviewers
# gate; see docs/hosting.md for the full list.
#
#   1. migrate the database          (expand/contract; skipped on rollback)
#   2. deploy the server by digest   -> wait until /healthz reports this version
#   3. deploy the client by digest
#   4. deploy smoke                  (scripts/deploy-smoke.ts)
#   5. if any of that failed and `auto_rollback` is set, put both apps back on
#      the images they were running before this run started
#
# Both deploy steps are scoped `terraform apply -target=render_web_service.*`
# rather than a full apply, so a run here only ever changes the one resource
# it names - it never reconciles unrelated drift (e.g. in
# supabase_settings.main) as a side effect of a release.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: "Release tag, e.g. v1.2.3 (also the git ref whose migrations and smoke script are used)"
        type: string
        required: true
      server_image:
        description: "Server image pinned by digest: ghcr.io/<owner>/castle-clash-server@sha256:..."
        type: string
        required: true
      client_image:
        type: string
        required: true
      rollback:
        description: "Redeploy an older release: no database push, since the database is already ahead of it"
        type: boolean
        default: false
      auto_rollback:
        description: "Revert both apps to their previous images when this deploy fails"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  # Read by the `github` Terraform provider for the repository/ruleset/
  # environment resources in infra/terraform/github.tf - every apply here
  # refreshes the whole resource graph, not just the two targeted resources.
  # Read-only: this workflow never writes a github_* resource, only
  # render_web_service ones (-target). Every caller in the chain
  # (release.yaml -> deploy.yaml -> here) must grant this explicitly -
  # a reusable workflow cannot escalate beyond what its caller granted.
  administration: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      EXPECTED_VERSION: ${{ inputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      # Dependencies are installed (and the smoke script's workspace dependency
      # built) BEFORE any credential exists in this job, so a compromised
      # package from the tag being deployed never runs with an Azure session.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @castle-clash/shared run build

      # Terraform's state lives in Azure Storage (infra/terraform/backend.tf);
      # this identity only needs blob access to it, not the Container Apps
      # Contributor role identity.tf also grants it for the Azure resources
      # still being decommissioned.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Record the images currently running (rollback target)
        id: previous
        working-directory: infra/terraform
        run: |
          for kind in server client; do
            addr="render_web_service.${kind}"
            image="$(terraform show -json | jq -r --arg a "$addr" '
              .values.root_module.resources[] | select(.address == $a) |
              .values.runtime_source.image | "\(.image_url)@\(.digest)"')"
            echo "${kind}=${image}" >> "$GITHUB_OUTPUT"
            echo "previous ${kind}: ${image}"
          done

      # Expand/contract discipline (docs/hosting.md): every migration must
      # leave the *previous* release working, so the schema can move first and
      # a failed rollout never needs a database rollback. Never run on a
      # rollback: the database is ahead of the older tag's migration folder,
      # which `db push` rejects.
      - if: ${{ !inputs.rollback }}
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Push database migrations
        if: ${{ !inputs.rollback }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy server (by digest)
        working-directory: infra/terraform
        run: terraform apply -auto-approve -target=render_web_service.server -var server_image="$SERVER_IMAGE"
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}

      # Render replaces the running instance with the new one directly (no
      # revision concept to wait behind, unlike Azure's single-revision mode),
      # but the server still needs to finish booting - wait until the *new*
      # version is what answers before touching the client.
      - name: Wait for the new server version
        run: |
          origin="${GAME_SERVER_URL/#wss:/https:}"
          origin="${origin/#ws:/http:}"
          want="${EXPECTED_VERSION#v}"
          for attempt in $(seq 1 60); do
            got="$(curl -fsS "${origin}/healthz" 2>/dev/null | jq -r '.version // empty' || true)"
            [ "$got" = "$want" ] && { echo "server is on ${want}"; exit 0; }
            echo "attempt ${attempt}: server reports '${got}', waiting for '${want}'"
            sleep 10
          done
          echo "::error::server never reported version ${want}"
          exit 1

      - name: Deploy client (by digest)
        working-directory: infra/terraform
        run: terraform apply -auto-approve -target=render_web_service.client -var client_image="$CLIENT_IMAGE"
        env:
          CLIENT_IMAGE: ${{ inputs.client_image }}

      - name: Deploy smoke
        run: pnpm --filter @castle-clash/server run deploy-smoke
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          SMOKE_ATTEMPTS: "60"
          SMOKE_RETRY_DELAY_MS: "5000"

      - name: Roll the apps back to their previous images
        if: ${{ failure() && inputs.auto_rollback }}
        working-directory: infra/terraform
        run: |
          args=()
          for kind in server client; do
            prev_var="PREVIOUS_${kind^^}"
            case "${!prev_var}" in
              ghcr.io/*) args+=("-target=render_web_service.${kind}" "-var" "${kind}_image=${!prev_var}") ;;
              *) echo "no previous release image for ${kind} (was '${!prev_var}'), leaving it" ;;
            esac
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no previous images recorded for either app; nothing to roll back"
            exit 0
          fi
          terraform apply -auto-approve "${args[@]}"
          echo "::warning::rolled back to the previous images; the database was NOT rolled back"
        env:
          PREVIOUS_SERVER: ${{ steps.previous.outputs.server }}
          PREVIOUS_CLIENT: ${{ steps.previous.outputs.client }}
