server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `entrypoint.sh` renders /tmp/csp-headers.conf at container start (the
  # allowed origins come from runtime env vars). nginx does NOT inherit
  # server-level `add_header`s into a location that declares its own, and
  # every location below declares a Cache-Control — so the CSP is included
  # per location, and a server-level include would be dead.

  # The SPA shell: never cached, so a new deploy's hashed asset URLs are
  # picked up immediately (plan Phase 10 step 2).
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  # Only Vite's content-hashed build output is safe to cache forever. Scoped
  # to /assets/ (not by file extension) so an unhashed file dropped into
  # `public/` — a favicon, say — is never cached for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /tmp/csp-headers.conf;
  }
}
