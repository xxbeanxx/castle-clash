services:
  server:
    build:
      context: .
      dockerfile: apps/server/containerfile
    # CI's smoke job loads a pre-built image under this tag (see docker.yml) so
    # `up` runs it as-is instead of rebuilding; `podman build -t
    # castle-clash-server .` (see CLAUDE.md) tags a local build the same way.
    image: castle-clash-server:local
    ports:
      - "2567:2567"
    healthcheck:
      # 127.0.0.1, not localhost: nginx's client-side counterpart below only
      # binds IPv4 in this image, and localhost can resolve to ::1 first.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2567/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  client:
    build:
      context: .
      dockerfile: apps/client/containerfile
    image: castle-clash-client:local
    ports:
      - "8080:8080"
    environment:
      # The browser connects directly to this URL, so it must be reachable from
      # the host, not the container network's internal "server" hostname.
      GAME_SERVER_URL: ws://localhost:2567
      # Supabase auth/persistence lands in Phase 8; the client container's
      # entrypoint requires these to be set, so placeholders stand in for now.
      SUPABASE_URL: http://localhost:0
      SUPABASE_PUBLISHABLE_KEY: local-dev-placeholder
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # nginx here only binds IPv4 (see apps/client/docker/nginx.conf's
      # `listen 8080` — IPv6 setup fails silently against the read-only
      # config mount), so localhost, which resolves ::1 first, doesn't connect.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15
