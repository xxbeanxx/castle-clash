name: containers

on:
  pull_request:
  push:
    branches: [main]
    # Release (`vX.Y.Z`) images are built by docker.yaml, not here: they need
    # multi-arch, provenance/SBOM and a Trivy gate this smoke-first flow lacks.

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a PR, reports whether it touches anything the images are built from (see
  # changes.yaml and .github/paths-filter.yaml). Every other trigger builds.
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yaml

  # Required checks `build (server)` / `build (client)` are named by this
  # matrix's expanded entries. Skipping the job with a job-level `if` would
  # leave the matrix unexpanded, those checks would never report, and the PR
  # would wait on them forever — so the job always runs and its steps are gated.
  build:
    needs: changes
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    env:
      IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
    steps:
      - if: env.IMAGES_CHANGED == 'true'
        uses: actions/checkout@v7
      - if: env.IMAGES_CHANGED == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
      # Build the image locally; only the `push` job (gated on `smoke`
      # passing) publishes to GHCR.
      - name: Build image
        if: env.IMAGES_CHANGED == 'true'
        run: |
          build_args=()
          while IFS= read -r label || [ -n "$label" ]; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"
          while IFS= read -r tag || [ -n "$tag" ]; do
            [ -n "$tag" ] && build_args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          podman build "${build_args[@]}" \
            -t castle-clash-${{ matrix.app }}:local \
            -f apps/${{ matrix.app }}/containerfile .
      - if: env.IMAGES_CHANGED == 'true'
        run: podman save castle-clash-${{ matrix.app }}:local -o /tmp/${{ matrix.app }}.tar
      - if: env.IMAGES_CHANGED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}
          path: /tmp/${{ matrix.app }}.tar
          retention-days: 1

  # `smoke` is a plain job, so it can be skipped outright (a skipped required
  # check counts as passing) — and `push` never runs on a PR.
  smoke:
    needs: [changes, build]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - run: |
          podman load -i /tmp/images/server.tar
          podman load -i /tmp/images/client.tar
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # smoke-join runs via tsx (no server build needed) but imports
      # @castle-clash/shared, which resolves through the workspace symlink to
      # packages/shared/dist — that only exists after a build, which `pnpm
      # install` doesn't do.
      - run: pnpm --filter @castle-clash/shared run build
      # Since Phase 8 the server rejects any join without a real Supabase JWT,
      # so this job needs a real (local) Supabase, started the same way
      # integration.yaml does it (the pinned `supabase` devDependency; the
      # runner's preinstalled Docker). `start` applies supabase/migrations.
      - run: pnpm exec supabase start --exclude studio,logflare,vector,imgproxy
      - name: Export local Supabase connection info
        run: |
          status=$(pnpm exec supabase status -o json)
          {
            echo "SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r '.PUBLISHABLE_KEY')"
            echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SECRET_KEY')"
          } >> "$GITHUB_ENV"
      # `podman compose` shells out to the docker-compose CLI plugin already on
      # this runner (for Docker), which expects a running Docker-API-compatible
      # daemon and errors against podman's (inactive) socket. Neither
      # `podman-compose` nor `podman compose` has ever been validated for this
      # project (see CLAUDE.md's compose.yaml section) — run the two images
      # directly instead, mirroring compose.yaml's ports/env by hand, the same
      # way it's been hand-validated locally.
      # The containerfiles carry no baked-in HEALTHCHECK (only compose.yaml
      # defines one), so it's passed here explicitly, matching compose.yaml's
      # test/interval/timeout/retries exactly.
      - name: Start containers
        run: |
          podman network create cc-net
          # Host networking: local Supabase is published on the runner's
          # 127.0.0.1:54321, which a container on cc-net cannot reach. (Ports
          # are the host's own, so there is no -p.)
          podman run -d --name server --network host \
            -e SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
            --health-cmd 'wget -q --spider http://127.0.0.1:2567/healthz' \
            --health-interval 2s --health-timeout 2s --health-retries 15 \
            castle-clash-server:local
          podman run -d --name client --network cc-net -p 8080:8080 \
            -e GAME_SERVER_URL=ws://localhost:2567 \
            -e SUPABASE_URL=http://localhost:0 \
            -e SUPABASE_PUBLISHABLE_KEY=local-dev-placeholder \
            --health-cmd 'wget -q --spider http://127.0.0.1:8080/' \
            --health-interval 2s --health-timeout 2s --health-retries 15 \
            castle-clash-client:local
      - name: Wait for containers to be healthy
        run: |
          for name in server client; do
            echo "waiting for $name..."
            for i in $(seq 1 30); do
              status="$(podman inspect -f '{{.State.Health.Status}}' "$name")"
              [ "$status" = "healthy" ] && { echo "$name is healthy"; break; }
              if [ "$i" = 30 ]; then
                echo "$name did not become healthy in time (status: $status)" >&2
                exit 1
              fi
              sleep 2
            done
          done
      - run: curl -sf http://localhost:2567/healthz
      - run: curl -sf http://localhost:8080/
      # A headless @colyseus/sdk client joins the "match" room through the
      # running client-facing port and asserts that room state actually
      # arrives — the same round trip a browser tab makes.
      - run: pnpm --filter @castle-clash/server run smoke-join
        env:
          GAME_SERVER_URL: ws://localhost:2567
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
      - if: always()
        run: podman logs server; podman logs client
      - if: always()
        run: |
          podman rm -f server client
          podman network rm cc-net
      - if: always()
        run: pnpm exec supabase stop

  # Only images that passed `smoke` get published — loads the pre-built
  # image artifact, tags with GHCR metadata, and pushes.
  push:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.app }}
          path: /tmp
      - run: podman load -i /tmp/${{ matrix.app }}.tar
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
      - name: Push image
        run: |
          while IFS= read -r tag || [ -n "$tag" ]; do
            if [ -n "$tag" ]; then
              podman tag castle-clash-${{ matrix.app }}:local "$tag"
              podman push "$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
