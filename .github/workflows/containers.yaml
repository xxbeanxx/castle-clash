name: containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      # Build the image locally; only the `push` job (gated on `smoke`
      # passing) publishes to GHCR.
      - name: Build image
        run: |
          build_args=()
          while IFS= read -r label || [ -n "$label" ]; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"
          while IFS= read -r tag || [ -n "$tag" ]; do
            [ -n "$tag" ] && build_args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          podman build "${build_args[@]}" \
            -t castle-clash-${{ matrix.app }}:local \
            -f apps/${{ matrix.app }}/containerfile .
      - run: podman save castle-clash-${{ matrix.app }}:local -o /tmp/${{ matrix.app }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp/${{ matrix.app }}.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - run: |
          podman load -i /tmp/images/server.tar
          podman load -i /tmp/images/client.tar
      # compose.yaml's `image:` fields match the tags loaded above, so `up`
      # runs those images as-is instead of rebuilding from source.
      - run: podman compose up -d --wait
      - run: curl -sf http://localhost:2567/healthz
      - run: curl -sf http://localhost:8080/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # smoke-join runs via tsx (no server build needed) but imports
      # @castle-clash/shared, which resolves through the workspace symlink to
      # packages/shared/dist — that only exists after a build, which `pnpm
      # install` doesn't do.
      - run: pnpm --filter @castle-clash/shared run build
      # A headless @colyseus/sdk client joins the "match" room through the
      # running client-facing port and asserts that room state actually
      # arrives — the same round trip a browser tab makes.
      - run: pnpm --filter @castle-clash/server run smoke-join
        env:
          GAME_SERVER_URL: ws://localhost:2567
      - if: always()
        run: podman compose logs
      - if: always()
        run: podman compose down --volumes

  # Only images that passed `smoke` get published — loads the pre-built
  # image artifact, tags with GHCR metadata, and pushes.
  push:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp
      - run: podman load -i /tmp/${{ matrix.app }}.tar
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Push image
        run: |
          while IFS= read -r tag || [ -n "$tag" ]; do
            if [ -n "$tag" ]; then
              podman tag castle-clash-${{ matrix.app }}:local "$tag"
              podman push "$tag"
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
