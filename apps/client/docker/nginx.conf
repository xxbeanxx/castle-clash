server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `entrypoint.sh` renders /tmp/csp-headers.conf at container start (the
  # allowed origins come from runtime env vars). nginx does NOT inherit
  # server-level `add_header`s into a location that declares its own, and
  # every location below declares a Cache-Control — so the CSP is included
  # per location, and a server-level include would be dead.

  # The SPA shell: never cached, so a new deploy's hashed asset URLs are
  # picked up immediately (plan Phase 10 step 2).
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  # Prerendered pages (`/`, `/privacy`, ...) are real files, found by
  # `$uri/index.html`. (Not `$uri/`: for a directory nginx answers 301 to the
  # trailing-slash URL with its own listen port, 8080, which the platform's
  # ingress does not expose.) Everything else is a client-side route and
  # gets the bare shell in `__spa-fallback.html`: falling back to `index.html`
  # would serve the prerendered landing page at `/lobby` and hydrate the wrong
  # tree (see docs/research/phase11-prerender-and-metadata.md).
  location / {
    try_files $uri $uri/index.html /__spa-fallback.html;
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  # Only Vite's content-hashed build output is safe to cache forever. Scoped
  # to /assets/ (not by file extension) so an unhashed file dropped into
  # `public/` — a favicon, say — is never cached for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /tmp/csp-headers.conf;
  }
}
