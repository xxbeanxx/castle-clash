server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `entrypoint.sh` renders this at container start (the allowed origins come
  # from runtime env vars). nginx does NOT inherit server-level `add_header`s
  # into a location that declares its own, so every location below that sets
  # a Cache-Control header re-includes it.
  include /tmp/csp-headers.conf;

  # The SPA shell: never cached, so a new deploy's hashed asset URLs are
  # picked up immediately (plan Phase 10 step 2).
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
    include /tmp/csp-headers.conf;
  }

  # Vite content-hashes every emitted asset filename, so these never change
  # under the same URL.
  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /tmp/csp-headers.conf;
  }
}
