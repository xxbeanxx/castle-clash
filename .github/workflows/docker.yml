name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # push:false/load:true here regardless of branch — only the `push` job
      # (gated on `smoke` passing) publishes to GHCR.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/containerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            castle-clash-${{ matrix.app }}:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - run: docker save castle-clash-${{ matrix.app }}:local -o /tmp/${{ matrix.app }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp/${{ matrix.app }}.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - run: |
          docker load -i /tmp/images/server.tar
          docker load -i /tmp/images/client.tar

      # compose.yaml's `image:` fields match the tags loaded above, so `up`
      # runs those images as-is instead of rebuilding from source.
      - run: docker compose up -d --wait

      - run: curl -sf http://localhost:2567/healthz
      - run: curl -sf http://localhost:8080/

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A headless @colyseus/sdk client joins the "match" room through the
      # running client-facing port and asserts that room state actually
      # arrives — the same round trip a browser tab makes.
      - run: pnpm --filter @castle-clash/server run smoke-join
        env:
          GAME_SERVER_URL: ws://localhost:2567

      - if: always()
        run: docker compose logs

      - if: always()
        run: docker compose down --volumes

  # Only images that passed `smoke` get published — this rebuild is a cache
  # hit against the `build` job's `cache-to: type=gha`, so it's fast.
  push:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        app: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castle-clash-${{ matrix.app }}
          tags: |
            type=raw,value=sha-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
